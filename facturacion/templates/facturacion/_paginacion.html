{% if pagina.paginator.num_pages > 1 %}<nav class="pagination-bar" aria-label="Paginación"><span>{{ pagina.paginator.count }} registros · Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span><div>{% if pagina.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ pagina.previous_page_number }}">← Anterior</a>{% endif %} {% if pagina.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ pagina.next_page_number }}">Siguiente →</a>{% endif %}</div></nav>{% endif %}
