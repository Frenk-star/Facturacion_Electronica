components:
  schemas:
    Cliente:
      type: object
      description: Ejecuta las validaciones de dominio también para escrituras REST.
      properties:
        id:
          type: integer
          readOnly: true
        activo:
          type: boolean
        tipo_doc:
          $ref: '#/components/schemas/TipoDocEnum'
        num_doc:
          type: string
          maxLength: 15
        razon_social:
          type: string
          maxLength: 255
        direccion:
          type: string
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        empresa:
          type: integer
          readOnly: true
          nullable: true
      required:
      - direccion
      - empresa
      - id
      - num_doc
      - razon_social
      - tipo_doc
    Comprobante:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        empresa:
          type: integer
          nullable: true
        serie:
          type: string
          maxLength: 4
        numero:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        fecha:
          type: string
          format: date-time
          readOnly: true
        cliente:
          type: integer
        cliente_nombre:
          type: string
          readOnly: true
        cliente_num_doc:
          type: string
          readOnly: true
        tipo:
          $ref: '#/components/schemas/ComprobanteTipoEnum'
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        igv:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleComprobante'
          readOnly: true
        saldo_disponible:
          type: number
          format: double
          readOnly: true
      required:
      - cliente
      - cliente_nombre
      - cliente_num_doc
      - detalles
      - fecha
      - id
      - igv
      - saldo_disponible
      - serie
      - subtotal
      - tipo
      - total
    ComprobanteTipoEnum:
      enum:
      - '01'
      - '03'
      - '07'
      type: string
      description: |-
        * `01` - Factura
        * `03` - Boleta
        * `07` - Nota de crédito
    ConteoEstado:
      type: object
      properties:
        estado:
          type: string
        cantidad:
          type: integer
      required:
      - cantidad
      - estado
    ConteoTipo:
      type: object
      properties:
        tipo:
          type: string
        cantidad:
          type: integer
      required:
      - cantidad
      - tipo
    Dashboard:
      type: object
      properties:
        mes:
          type: integer
        anio:
          type: integer
        resumen:
          $ref: '#/components/schemas/ResumenVentas'
        comprobantes:
          type: array
          items:
            $ref: '#/components/schemas/FilaVenta'
        estados:
          type: array
          items:
            $ref: '#/components/schemas/ConteoEstado'
        tipos:
          type: array
          items:
            $ref: '#/components/schemas/ConteoTipo'
      required:
      - anio
      - comprobantes
      - estados
      - mes
      - resumen
      - tipos
    DetalleComprobante:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        producto:
          type: integer
        producto_nombre:
          type: string
          readOnly: true
        cantidad:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        precio_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        descuento:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        igv_linea:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - cantidad
      - id
      - igv_linea
      - precio_unitario
      - producto
      - producto_nombre
      - subtotal
    EmitirComprobanteInput:
      type: object
      properties:
        empresa_id:
          type: integer
        cliente_id:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemInput'
        borrador:
          type: boolean
          default: false
        serie:
          type: string
          maxLength: 4
        resultado_mock:
          allOf:
          - $ref: '#/components/schemas/ResultadoMockEnum'
          default: ACEPTADO
        clave_idempotencia:
          type: string
          maxLength: 100
      required:
      - cliente_id
      - items
    Empresa:
      type: object
      description: Ejecuta las validaciones de dominio también para escrituras REST.
      properties:
        id:
          type: integer
          readOnly: true
        ruc:
          type: string
          pattern: ^\d{11}$
          maxLength: 11
        razon_social:
          type: string
          maxLength: 255
        nombre_comercial:
          type: string
          nullable: true
          maxLength: 255
        direccion:
          type: string
        regimen_tributario:
          type: string
          maxLength: 50
      required:
      - direccion
      - id
      - razon_social
      - regimen_tributario
      - ruc
    EstadoEnum:
      enum:
      - BORRADOR
      - EMITIDO
      - ENVIADO
      - ACEPTADO
      - RECHAZADO
      type: string
      description: |-
        * `BORRADOR` - Borrador
        * `EMITIDO` - Emitido
        * `ENVIADO` - Enviado
        * `ACEPTADO` - Aceptado
        * `RECHAZADO` - Rechazado
    FilaVenta:
      type: object
      description: Describe una fila contable con signo negativo para créditos.
      properties:
        id:
          type: integer
        fecha:
          type: string
          format: date
        tipo:
          type: string
        documento:
          type: string
        cliente:
          type: string
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        igv:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - cliente
      - documento
      - fecha
      - id
      - igv
      - subtotal
      - tipo
      - total
    HistorialEstado:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        anterior:
          type: string
          maxLength: 15
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        fecha:
          type: string
          format: date-time
          readOnly: true
        comprobante:
          type: integer
        usuario:
          type: integer
          nullable: true
      required:
      - comprobante
      - estado
      - fecha
      - id
    ItemInput:
      type: object
      properties:
        producto_id:
          type: integer
          minimum: 1
        cantidad:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        precio_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        descuento:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
      required:
      - cantidad
      - producto_id
    LibroVentas:
      type: object
      properties:
        mes:
          type: integer
        anio:
          type: integer
        resumen:
          $ref: '#/components/schemas/ResumenVentas'
        comprobantes:
          type: array
          items:
            $ref: '#/components/schemas/FilaVenta'
      required:
      - anio
      - comprobantes
      - mes
