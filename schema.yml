openapi: 3.0.3
info:
  title: Facturación académica SUNAT
  version: 1.0.0
  description: API multiempresa con OSE simulado. Sin validez tributaria.
paths:
  /api/boletas/:
    post:
      operationId: boletas_create
      description: Expone documentos inmutables y acciones explícitas de negocio.
      parameters:
      - in: query
        name: cliente
        schema:
          type: string
      - in: query
        name: estado
        schema:
          type: string
      - in: query
        name: fecha_desde
        schema:
          type: string
      - in: query
        name: fecha_hasta
        schema:
          type: string
      - in: query
        name: ruc_cliente
        schema:
          type: string
      - in: query
        name: tipo
        schema:
          type: string
      tags:
      - boletas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitirComprobanteInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmitirComprobanteInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmitirComprobanteInput'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comprobante'
          description: ''
  /api/clientes/:
